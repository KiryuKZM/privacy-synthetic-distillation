[project]
name = "privacy-synth"
version = "0.0.1"
description = "Privacy-constrained synthetic distillation pilot"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers==5.18.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "huggingface-hub==1.33.0",
    "socksio==1.0.0",
    "safetensors==0.8.0",
    "numpy>=2.1",
    "pandas>=2.2",
    "tqdm>=4.67",
    "rdt>=1.14",
    "ctgan",
    "xgboost>=3.4.1",
    "einops==0.8.2",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "rasterio==1.4.3",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
ctgan = { path = "vendor/ctgan", editable = true }
